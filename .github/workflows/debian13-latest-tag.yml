# Builds a Debian 13 (trixie) .deb package of OpenCPN from the latest upstream release tag.
#
# Why this exists: Debian 13's own apt repo ships an older OpenCPN than upstream's latest release, and
# there's no official trixie package from upstream CI (.circleci/config.yml only builds bookworm and
# jammy). This reuses the project's own packaging exactly as its CircleCI bookworm job does -- same
# ci/generic-build-debian.sh script, same debian/ packaging directory (from the ci/trixie-backports
# branch, which already exists upstream) -- just run inside a debian:trixie container via GitHub Actions
# instead of CircleCI, and pinned to a release tag instead of master HEAD.
name: Build Debian 13 package from latest release tag

on:
  workflow_dispatch:
  schedule:
    # Weekly: catches a new upstream release tag without needing a manual trigger.
    - cron: '17 4 * * 1'

jobs:
  build:
    name: Debian 13 (trixie) package
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
    env:
      PACKAGE_BRANCH: ci/trixie-backports
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Tools the bare container and actions/checkout need (git, sudo, curl, jq)
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends git sudo ca-certificates curl jq

      - name: Resolve the latest upstream release tag
        id: tag
        run: |
          tag=$(curl -fsSL https://api.github.com/repos/OpenCPN/OpenCPN/releases/latest | jq -r .tag_name)
          [ -n "$tag" ] && [ "$tag" != null ] || { echo "::error::could not resolve the latest release tag"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: OpenCPN/OpenCPN
          ref: ${{ steps.tag.outputs.tag }}

      - name: Trust the checked-out tree (container UID differs from the one actions/checkout used)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Pre-create the sibling "project" dir the script expects (a CircleCI checkout-path assumption)
        # ci/generic-build-debian.sh finishes with `mkdir ../project/build` and `mv ../*deb ../project/build`,
        # relative to the extracted opencpn-*/ source dir it builds in (one level below the checkout root) --
        # CircleCI's default checkout path is ~/project, so that resolves there; ours is $GITHUB_WORKSPACE
        # (named after the repo, not "project"), so the directory never exists unless created first.
        run: mkdir -p "$(dirname "$GITHUB_WORKSPACE")/project"

      - name: Build the Debian 13 package (ci/generic-build-debian.sh, from this repo's own CI)
        run: ci/generic-build-debian.sh

      - name: Collect the built .debs into the workspace (upload-artifact rejects ".." in its path pattern)
        run: |
          mkdir -p dist
          cp "$(dirname "$GITHUB_WORKSPACE")/project/build/"*.deb dist/

      - name: Add an install script to the artifact
        run: |
          cat > dist/install.sh <<'EOF'
          #!/usr/bin/env bash
          # Installs the OpenCPN .deb packages next to this script.
          # Skips opencpn-dbgsym (debug symbols only, not needed to run OpenCPN).
          # `apt-get install` (not `dpkg -i`) so it resolves the opencpn/opencpn-data
          # dependency between the two files and pulls in any missing libs from apt.
          set -euo pipefail

          dir="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          cd "$dir"

          shopt -s nullglob
          debs=(opencpn_*.deb opencpn-data_*.deb)
          shopt -u nullglob

          if [ ${#debs[@]} -eq 0 ]; then
            echo "No opencpn_*.deb / opencpn-data_*.deb found next to this script ($dir)." >&2
            exit 1
          fi

          paths=()
          for f in "${debs[@]}"; do
            paths+=("./$f")
          done

          echo "Installing: ${paths[*]}"
          sudo apt-get install -y "${paths[@]}"
          EOF
          chmod +x dist/install.sh

      - uses: actions/upload-artifact@v4
        with:
          name: opencpn-debian13-${{ steps.tag.outputs.tag }}
          path: |
            dist/*.deb
            dist/install.sh
          if-no-files-found: error
